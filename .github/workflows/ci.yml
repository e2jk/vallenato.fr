name: CI

run-name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Publishing version {0}', github.ref_name) || github.event.pull_request.title || github.event.head_commit.message || github.ref_name }}

on:
  push:
  pull_request:

permissions: read-all  # zizmor: ignore[excessive-permissions] intentional: workflow default is read-only, every job opts into exactly the write scopes it needs

# Keyed on event+ref: a newer push/PR-update cancels the previous still-
# running check for the same branch/PR. Exception: every ship/dependabot/
# renovate pull_request — the only PRs that publish_now (see the version job)
# — shares one 'bot-pipeline' lane for the ENTIRE run, so at most one publish
# pipeline is ever in flight. Queues (cancel-in-progress: false) rather than
# cancels. Adapted from OpenHangar's ci.yml concurrency design.
concurrency:
  group: ${{ (github.event_name == 'pull_request' && (github.head_ref == 'ship' || startsWith(github.head_ref, 'dependabot/') || startsWith(github.head_ref, 'renovate/'))) && 'bot-pipeline' || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'pull_request' && (github.head_ref == 'ship' || startsWith(github.head_ref, 'dependabot/') || startsWith(github.head_ref, 'renovate/'))) }}

jobs:
  lint-and-test:
    name: Lint, type-check, and test
    # Skipped for a push to ship/a bot branch or to master — those pushes do
    # no CI work: a push to ship/a bot branch just gets a PR opened
    # (auto-pr-merge.yml / native automerge), and the pull_request event that
    # follows is where this actually runs; a push to master lands content a
    # PR already fully tested and published, so it's a pure no-op.
    if: |
      !(github.event_name == 'push' && (github.ref == 'refs/heads/ship' || startsWith(github.ref, 'refs/heads/dependabot/') || startsWith(github.ref, 'refs/heads/renovate/') || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write  # pip-audit SARIF upload
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: bin/requirements.txt

      - name: Set up venv
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --require-hashes -r bin/requirements-pip-bootstrap.txt
          .venv/bin/pip install --quiet --require-hashes -r bin/requirements.txt
          .venv/bin/pip install --quiet --require-hashes -r bin/requirements-dev.txt

      - name: Lint with Ruff
        run: .venv/bin/ruff check bin scripts .github/scripts

      - name: Check formatting with Ruff
        run: .venv/bin/ruff format --check bin scripts .github/scripts

      - name: Type-check with mypy
        run: .venv/bin/mypy --config-file bin/pyproject.toml bin/

      - name: Security scan with bandit
        run: .venv/bin/bandit -c bin/pyproject.toml -r bin/ -ll -i

      - name: Lint workflows with zizmor
        run: .venv/bin/zizmor -q --persona=pedantic --offline .github/

      - name: Install actionlint
        run: |
          curl -sfL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint

      - name: Lint workflows with actionlint
        run: ./actionlint -color

      - name: Audit all dependencies (runtime + transitive)
        id: pip-audit
        continue-on-error: true
        run: .venv/bin/pip-audit --local --format json -o pip-audit.json

      - name: Convert pip-audit JSON to SARIF
        if: always() && hashFiles('pip-audit.json') != ''
        run: python3 .github/scripts/pip_audit_to_sarif.py pip-audit.json pip-audit.sarif

      - name: Upload pip-audit results to GitHub Security tab
        if: always() && hashFiles('pip-audit.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: pip-audit.sarif
          category: pip-audit

      - name: Fail if pip-audit found vulnerabilities
        if: steps.pip-audit.outcome == 'failure'
        run: exit 1

      - name: Run tests
        run: bash bin/test.sh

      - name: Generate coverage badge
        run: .venv/bin/python scripts/generate_coverage_badge.py

      - name: Assemble Pages site
        run: |
          mkdir -p _site/coverage
          cp -r html_dev/coverage/. _site/coverage/
          cp .github/pages/index.html _site/index.html

      - name: Upload site content artifact
        # Mirrors publish_now's own condition in the version job below
        # (duplicated here rather than depended-on, for the same
        # no-needs-dependency reason as this job's own if: above).
        if: |
          startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'pull_request' && (github.head_ref == 'ship' || startsWith(github.head_ref, 'dependabot/') || startsWith(github.head_ref, 'renovate/')))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pages-content
          path: _site
          retention-days: 1

  dependency-review:
    name: Dependency review (new/changed dependencies)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, PSF-2.0, LGPL-3.0-or-later, MPL-2.0, MIT-CMU, 0BSD

  version:
    name: Compute build version
    # publish_now = true for a pull_request from ship/a bot branch (the one
    # place content is tested — see this job's if: below) with native
    # auto-merge armed, or a push to a version tag. Skipped for a push to
    # ship/a bot branch or to master — same rationale as lint-and-test's if:.
    if: |
      !(github.event_name == 'push' && (github.ref == 'refs/heads/ship' || startsWith(github.ref, 'refs/heads/dependabot/') || startsWith(github.ref, 'refs/heads/renovate/') || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # push the version-reservation tag (publish_now only)
      pull-requests: read  # gh pr view, to confirm auto-merge is armed before publishing
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      version: ${{ steps.compute.outputs.version }}
      publish_now: ${{ steps.compute.outputs.publish_now }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true  # needed to push the reservation tag below (publish_now only)
          fetch-depth: 0  # needed to inspect git tags for bin/-vs-other bump logic and next-version computation

      - name: Compute build version, reserve it, and set publish role
        id: compute
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          PUBLISH_NOW=false
          case "${GITHUB_EVENT_NAME}" in
            push)
              case "${GITHUB_REF}" in
                refs/tags/v*) PUBLISH_NOW=true ;;
              esac
              ;;
            pull_request)
              case "${HEAD_REF}" in
                ship|dependabot/*|renovate/*)
                  AUTO_MERGE_ARMED=$(gh pr view "${PR_NUMBER}" --json autoMergeRequest --jq '.autoMergeRequest != null')
                  if [ "${AUTO_MERGE_ARMED}" = "true" ]; then
                    PUBLISH_NOW=true
                  else
                    echo "Auto-merge is not armed on this PR — not publishing."
                  fi
                  ;;
              esac
              ;;
          esac
          echo "publish_now=${PUBLISH_NOW}" >> "$GITHUB_OUTPUT"

          if [ "${PUBLISH_NOW}" != "true" ]; then
            VERSION="development"
            echo "Not a publish_now run — using placeholder version."
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "Using tagged version: ${VERSION}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            for attempt in 1 2 3 4 5; do
              LAST_TAG=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -1)
              if [ -n "$LAST_TAG" ] && [ -z "$(git log "${LAST_TAG}..HEAD" --oneline -- bin/)" ]; then
                BUMP="patch"
              else
                BUMP="minor"
              fi
              VERSION=$(python3 .github/scripts/next_semver.py --bump "${BUMP}" --last-tag "${LAST_TAG}")
              echo "Attempt ${attempt}/5 — last tag: ${LAST_TAG:-<none>}, bump type: ${BUMP}, candidate: v${VERSION}"

              git tag "v${VERSION}"
              if git push origin "refs/tags/v${VERSION}"; then
                echo "Reserved version: ${VERSION}"
                break
              fi
              git tag -d "v${VERSION}"
              echo "v${VERSION} was claimed by another run — refreshing tags and retrying..."
              git fetch --tags --force origin
              if [ "$attempt" = 5 ]; then
                echo "::error::Could not reserve a version number after 5 attempts."
                exit 1
              fi
            done
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Save version metadata
        if: steps.compute.outputs.publish_now == 'true'
        env:
          BUILD_VERSION: ${{ steps.compute.outputs.version }}
          GIT_SHA: ${{ github.sha }}
        run: |
          echo "VERSION=${BUILD_VERSION}" > version.txt
          echo "GIT_SHA=${GIT_SHA}" >> version.txt

      - name: Upload version artifact
        if: steps.compute.outputs.publish_now == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: version
          path: version.txt
          retention-days: 1

  osv-scan:
    name: OSV-Scanner (dependency vulnerability scan)
    needs: [version]
    if: needs.version.result == 'success'
    permissions:
      actions: read           # required by the reusable workflow to auto-detect context
      contents: read          # checkout
      security-events: write  # upload SARIF results to the Security tab
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0

  docker-build:
    name: Build ${{ matrix.name }} image
    # Single-arch (amd64) only for now — vallenato.fr has no confirmed arm64
    # deployment target yet; add an arm64 leg the same way OpenHangar does
    # (QEMU cross-build) if that changes.
    needs: [version]
    if: needs.version.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: site
            dockerfile: Dockerfile
            image: vallenato.fr
            artifact: vallenato-fr-ci
          - name: bin
            dockerfile: bin/Dockerfile
            image: vallenato.fr_bin
            artifact: vallenato-fr-bin-ci
    permissions:
      packages: write   # GHCR push (publish_now only)
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GIT_SHA: ${{ github.sha }}
      PUBLISH_NOW: ${{ needs.version.outputs.publish_now }}
      # Matrix values passed via env instead of interpolated directly into
      # run: blocks below (zizmor's template-injection audit) — these are
      # static literals from this same file's matrix.include, not
      # attacker-controllable, but env-var indirection is the recommended
      # pattern regardless of trust level, and it's no extra effort here.
      MATRIX_IMAGE: ${{ matrix.image }}
      MATRIX_DOCKERFILE: ${{ matrix.dockerfile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

      - name: Set up Python (site image only — regenerates website/prod)
        if: matrix.name == 'site'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: bin/requirements.txt

      - name: Generate website/prod (--no-fetch, no live YouTube credentials needed)
        if: matrix.name == 'site'
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --require-hashes -r bin/requirements-pip-bootstrap.txt
          .venv/bin/pip install --quiet --require-hashes -r bin/requirements.txt
          cd bin && ../.venv/bin/python vallenato_fr.py --website --no-fetch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH_NOW == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          CACHE_ARGS=(--cache-from "type=registry,ref=ghcr.io/e2jk/${MATRIX_IMAGE}:buildcache")
          if [ "${PUBLISH_NOW}" = "true" ]; then
            CACHE_ARGS+=(--cache-to "type=registry,ref=ghcr.io/e2jk/${MATRIX_IMAGE}:buildcache,mode=max")
          fi
          docker buildx build \
            -f "${MATRIX_DOCKERFILE}" \
            -t "${MATRIX_IMAGE}:ci" \
            -t "ghcr.io/e2jk/${MATRIX_IMAGE}:sha-${GIT_SHA}" \
            "${CACHE_ARGS[@]}" \
            --load .

      - name: Export image as compressed tarball
        run: docker save "${MATRIX_IMAGE}:ci" | gzip > image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: image.tar.gz
          retention-days: 1

      - name: Push sha-tagged image to GHCR
        if: env.PUBLISH_NOW == 'true'
        run: docker push "ghcr.io/e2jk/${MATRIX_IMAGE}:sha-${GIT_SHA}"

  docker-validate:
    name: Validate ${{ matrix.name }} image (smoke test, Trivy)
    needs: [version, docker-build]
    if: needs.version.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: site
            image: vallenato.fr
            artifact: vallenato-fr-ci
          - name: bin
            image: vallenato.fr_bin
            artifact: vallenato-fr-bin-ci
    permissions:
      security-events: write  # Trivy SARIF upload
    env:
      # See docker-build's env: block above for why matrix values are
      # passed this way instead of interpolated directly into run: blocks.
      MATRIX_IMAGE: ${{ matrix.image }}
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.artifact }}

      - name: Load Docker image
        run: gunzip -c image.tar.gz | docker load

      - name: Smoke-test site image
        if: matrix.name == 'site'
        run: |
          docker run -d --name smoke-site -p 8080:80 -e PUID=1000 -e PGID=1000 "${MATRIX_IMAGE}:ci"
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8080/ >/dev/null 2>&1 && break
            sleep 1
          done
          fail=0
          for path in / /aprender/ /paris-francia.html; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080${path}")
            echo "GET ${path} -> ${code}"
            [ "$code" = "200" ] || fail=1
          done
          docker logs smoke-site
          docker rm -f smoke-site
          if [ "$fail" != "0" ]; then
            echo "::error::Site smoke test failed"
            exit 1
          fi

      - name: Smoke-test bin image (run the real CLI end to end)
        # Not test.sh - the production image only installs bin/requirements.txt
        # (hash-pinned runtime deps), not requirements-dev.txt (pytest and
        # friends), matching normal practice of not bloating a production
        # image with dev-only tooling. Instead, actually run the real
        # --website --no-fetch pipeline (argparse, website.py, data.js
        # loading, HTML generation) inside the shipped image itself, the
        # same command docker-build already ran on the host to produce the
        # site image's website/prod. lint-and-test already runs the full
        # pytest suite on the host - this is a smoke test of the shipped
        # image's own runtime, not a second unit-test run.
        if: matrix.name == 'bin'
        run: docker run --rm "${MATRIX_IMAGE}:ci" --website --no-fetch

      - name: Run Trivy vulnerability scanner
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: 'true'
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security tab
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.name }}

  publish-images:
    name: Publish ${{ matrix.name }} image (tag, sign, attest, SBOM)
    needs: [version, lint-and-test, docker-validate, docker-build, osv-scan]
    if: |
      needs.version.outputs.publish_now == 'true' &&
      needs.lint-and-test.result == 'success' &&
      needs.docker-validate.result == 'success' &&
      needs.docker-build.result == 'success' &&
      needs.osv-scan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - name: site
            image: vallenato.fr
          - name: bin
            image: vallenato.fr_bin
    permissions:
      packages: write        # docker buildx imagetools create / push
      id-token: write        # OIDC token for cosign keyless signing, attestations
      attestations: write    # attest-build-provenance (image + SBOM)
      contents: write        # anchore/sbom-action dependency-snapshot submission
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GIT_SHA: ${{ github.sha }}
      VERSION: ${{ needs.version.outputs.version }}
      # See docker-build's env: block above for why matrix values are
      # passed this way instead of interpolated directly into run: blocks.
      MATRIX_IMAGE: ${{ matrix.image }}
      MATRIX_NAME: ${{ matrix.name }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble and push tags (imagetools, no rebuild)
        # The SHA-tagged image already passed validation upstream — this
        # only re-tags/pushes it, no build happens here. Single-arch, so
        # there's no multi-platform manifest merge, just extra tags on the
        # same image (imagetools works fine for that too).
        run: |
          SHORT_SHA=$(echo "${GIT_SHA}" | cut -c1-7)
          docker buildx imagetools create \
            --tag "ghcr.io/e2jk/${MATRIX_IMAGE}:${VERSION}" \
            --tag "ghcr.io/e2jk/${MATRIX_IMAGE}:latest" \
            --tag "ghcr.io/e2jk/${MATRIX_IMAGE}:sha-${SHORT_SHA}" \
            "ghcr.io/e2jk/${MATRIX_IMAGE}:sha-${GIT_SHA}"

      - name: Get image digest
        id: image-digest
        run: |
          DIGEST=$(docker buildx imagetools inspect \
            "ghcr.io/e2jk/${MATRIX_IMAGE}:${VERSION}" \
            --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Attest Docker image provenance (GitHub attestations)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/e2jk/${{ matrix.image }}
          subject-digest: ${{ steps.image-digest.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Docker image with cosign (keyless)
        env:
          IMAGE_DIGEST: ${{ steps.image-digest.outputs.digest }}
        run: |
          cosign sign --yes \
            "ghcr.io/e2jk/${MATRIX_IMAGE}@${IMAGE_DIGEST}"

      - name: Generate SBOM (CycloneDX) and submit dependency snapshot
        # Snapshot targets the stable :latest tag rather than :${VERSION} on
        # purpose: the dependency graph keys each alert to the manifest
        # string it was submitted under, so a per-version tag would make
        # every release mint a brand-new, permanently-open manifest instead
        # of one later releases can supersede.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/e2jk/${{ matrix.image }}:latest
          format: cyclonedx-json
          output-file: sbom-${{ matrix.name }}-${{ github.sha }}.cyclonedx.json
          upload-artifact: false
          dependency-snapshot: true

      - name: Sign SBOM with cosign (Sigstore bundle)
        run: |
          cosign sign-blob --yes \
            --bundle "sbom-${MATRIX_NAME}-${GIT_SHA}.cyclonedx.json.sigstore.json" \
            "sbom-${MATRIX_NAME}-${GIT_SHA}.cyclonedx.json"

      - name: Attest SBOM provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: sbom-${{ matrix.name }}-${{ github.sha }}.cyclonedx.json

      - name: Download SBOM provenance bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          find . -maxdepth 1 -name '*.jsonl' | sort > /tmp/before.txt
          gh attestation download "sbom-${MATRIX_NAME}-${GIT_SHA}.cyclonedx.json" \
            --repo "${REPO}"
          find . -maxdepth 1 -name '*.jsonl' | sort > /tmp/after.txt
          BUNDLE=$(comm -13 /tmp/before.txt /tmp/after.txt | head -1)
          mv "$BUNDLE" "sbom-${MATRIX_NAME}-${GIT_SHA}.cyclonedx.json.intoto.jsonl"

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets-${{ matrix.name }}
          path: sbom-${{ matrix.name }}-*.cyclonedx.json*
          retention-days: 1

  publish-release:
    name: Publish release (GitHub Release, Pages)
    needs: [version, publish-images]
    if: needs.version.outputs.publish_now == 'true' && needs.publish-images.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GIT_SHA: ${{ github.sha }}
      VERSION: ${{ needs.version.outputs.version }}
    permissions:
      contents: write  # gh release create
      pages: write     # deploy-pages
      id-token: write  # OIDC token for deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0  # needed to compute the previous minor tag for release notes

      - name: Download release asset artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-assets-*
          merge-multiple: true

      - name: Create GitHub Release
        # No --target: the version job already pushed the "vX.Y.Z" tag
        # (its reservation step) pointing at this exact commit, so
        # `gh release create` just attaches the release to that
        # already-existing tag.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          git fetch --tags --force
          PREVIOUS_TAG=$(git tag --list 'v[0-9]*' --sort=-version:refname | awk -v me="v${VERSION}" '
            found { print }
            $0 == me { found=1 }
          ' | grep -E '^v[0-9]+\.[0-9]+\.0$' | head -1)
          echo "Previous minor tag: ${PREVIOUS_TAG:-<none — first release>}"
          NOTES_ARGS=(--field tag_name="v${VERSION}" --field target_commitish="${GIT_SHA}")
          if [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "v${VERSION}" ]; then
            NOTES_ARGS+=(--field previous_tag_name="${PREVIOUS_TAG}")
          fi
          gh api "repos/${REPO}/releases/generate-notes" \
            --method POST \
            "${NOTES_ARGS[@]}" \
            --jq '.body' > /tmp/auto-notes.md

          # generate-notes only reports already-merged PRs, and the PR that
          # triggered this very run is still open at this exact moment —
          # publish happens before merge, by design. Add its own line
          # manually, right before the "Full Changelog" footer.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            SELF_LINE="* ${PR_TITLE} by @${PR_AUTHOR} in ${PR_URL}"
            awk -v line="$SELF_LINE" '
              /^\*\*Full Changelog\*\*/ && !inserted { print line; inserted=1 }
              { print }
              END { if (!inserted) print line }
            ' /tmp/auto-notes.md > /tmp/auto-notes-with-self.md
            mv /tmp/auto-notes-with-self.md /tmp/auto-notes.md
          fi
          {
            # shellcheck disable=SC2016  # backticks are literal markdown code-fences, not command substitution
            printf '## Docker Images\n\n```\ndocker pull ghcr.io/e2jk/vallenato.fr:%s\ndocker pull ghcr.io/e2jk/vallenato.fr_bin:%s\n```\n\n' "${VERSION}" "${VERSION}"
            cat /tmp/auto-notes.md
          } > /tmp/release-notes.md
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file /tmp/release-notes.md \
            "sbom-site-${GIT_SHA}.cyclonedx.json#SBOM (site image, CycloneDX JSON)" \
            "sbom-site-${GIT_SHA}.cyclonedx.json.sigstore.json#SBOM signature (site image, Sigstore)" \
            "sbom-site-${GIT_SHA}.cyclonedx.json.intoto.jsonl#SBOM provenance (site image, SLSA)" \
            "sbom-bin-${GIT_SHA}.cyclonedx.json#SBOM (bin image, CycloneDX JSON)" \
            "sbom-bin-${GIT_SHA}.cyclonedx.json.sigstore.json#SBOM signature (bin image, Sigstore)" \
            "sbom-bin-${GIT_SHA}.cyclonedx.json.intoto.jsonl#SBOM provenance (bin image, SLSA)"

      - name: Download site content artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pages-content
          path: _site

      - name: Update versions.json
        run: |
          curl -sf https://e2jk.github.io/vallenato.fr/versions.json \
            -o /tmp/versions-existing.json 2>/dev/null \
            || echo '[]' > /tmp/versions-existing.json
          python3 - "${VERSION}" <<'PYEOF'
          import json, sys
          version = sys.argv[1]
          try:
              with open('/tmp/versions-existing.json') as f:
                  versions = json.load(f)
              if not isinstance(versions, list):
                  versions = []
          except Exception:
              versions = []
          if version not in versions:
              versions.insert(0, version)
          with open('_site/versions.json', 'w') as f:
              json.dump(versions, f)
          print(f"versions.json updated: {versions}")
          PYEOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
