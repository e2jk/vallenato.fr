name: Published image vulnerability scan

# Trivy only runs against the freshly built image on push (ci.yml). A CVE
# published in an OS package baked into the image during a quiet period
# would go unnoticed until the next commit. Scan the already-published
# :latest images on a schedule instead, so a newly disclosed CVE fails a
# run (and emails the maintainer) even with no code changes. Daily keeps
# the worst-case detection gap during a quiet period to ~1 day — the scan
# itself only takes 30-60s per image, so the extra runs cost effectively
# nothing.

on:
  schedule:
    - cron: '19 5 * * *'   # daily 05:19 UTC — off-peak, distinct from the other scheduled workflows
  workflow_dispatch: {}     # allow manual runs for testing

permissions: read-all  # zizmor: ignore[excessive-permissions] intentional: workflow default is read-only, the job below opts into exactly the write scopes it needs

concurrency:
  group: image-scan
  cancel-in-progress: true

jobs:
  image-scan:
    name: Scan published ${{ matrix.name }} image with Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: site
            image: vallenato.fr
          - name: bin
            image: vallenato.fr_bin
    permissions:
      security-events: write  # Trivy SARIF upload
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/e2jk/${{ matrix.image }}:latest
          format: sarif
          output: trivy-latest-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: 'true'
          # pip vendors its own copies of setuptools/msgpack/etc. (used
          # internally for dependency resolution and caching, never imported
          # by our own code). CVEs against those vendored copies track pip's
          # own release cadence, not ours - waiting on us to re-pin wouldn't
          # fix anything, and new ones surface every time setuptools/msgpack
          # gets a fresh upstream CVE. Skip the whole vendor tree rather than
          # chase each one individually.
          skip-dirs: '**/pip/_vendor'
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security tab
        if: always() && hashFiles('trivy-latest-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: trivy-latest-results.sarif
          category: trivy-latest-${{ matrix.name }}
